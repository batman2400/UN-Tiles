<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#faf8f5" />
    <title>Offline | UN Tiles</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 1.5rem;
        font-family: Inter, system-ui, sans-serif;
        background: #faf8f5;
        color: #1c1917;
      }
      .card {
        max-width: 26rem;
        text-align: center;
        background: #fff;
        border: 1px solid #e8e1d8;
        border-radius: 1.25rem;
        padding: 2rem 1.5rem;
      }
      h1 { font-size: 1.5rem; margin: 0 0 0.5rem; }
      p { color: #57534e; line-height: 1.5; margin: 0 0 1.5rem; }
      a {
        display: inline-flex;
        min-height: 2.75rem;
        align-items: center;
        justify-content: center;
        padding: 0 1.25rem;
        border-radius: 0.75rem;
        background: #1c1917;
        color: #fff;
        text-decoration: none;
        font-size: 0.8rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You’re offline</h1>
      <p>UN Tiles needs a connection to load the latest collections. Reconnect and try again.</p>
      <a href="/">Retry</a>
    </div>
  </body>
</html>
